name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Find Android project
        run: |
          echo "Arquivos encontrados:"
          find . -maxdepth 4 -type f | sort | head -150

      - name: Build APK
        run: |
          GRADLEW=$(find . -name "gradlew" -type f | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERRO: gradlew não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PaceCoach-debug
          path: '**/build/outputs/apk/debug/*.apk' 
