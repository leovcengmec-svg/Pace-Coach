name: Build Pace Coach V5.8

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager --channel=3 "platforms;android-37.0"
          sdkmanager "build-tools;37.0.0"

      - name: Extract Pace Coach V5.8
        run: |
          rm -rf runnerup
          mkdir -p runnerup
          unzip -q PaceCoach_RunnerUp_V5_8_READY_FIX2.zip -d runnerup

      - name: Locate source
        run: |
          echo "===== ESTRUTURA DO PROJETO ====="
          find runnerup -maxdepth 2 \( -name "settings.gradle" -o -name "build.gradle" \) -print

      - name: Align Android SDK versions
        working-directory: runnerup
        run: |
          sed -i "s/buildToolsVersion = '37.0.0'/buildToolsVersion = '37.0.0'/" build.gradle
          sed -i "s/compileSdk = 37.2/compileSdk = 37/" build.gradle
          sed -i "s/targetSdk = 37.2/targetSdk = 36/" build.gradle

      - name: Prepare Git metadata
        working-directory: runnerup
        run: |
          git init
          git config user.email "build@pacecoach.local"
          git config user.name "Pace Coach Build"
          git add -A
          git commit -m "Pace Coach V5.8 build base" >/dev/null 2>&1 || true

      - name: Install Gradle 9.6.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.6.1-bin.zip
          unzip -q gradle-9.6.1-bin.zip -d "$HOME"
          echo "$HOME/gradle-9.6.1/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Build APK
        working-directory: runnerup
        run: |
          gradle :app:assembleLatestDebug --no-daemon

      - name: Find APK
        run: |
          echo "======================================"
          echo "          APK V5.8 GERADO"
          echo "======================================"
          find runnerup/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PaceCoach-V5.8-debug
          path: runnerup/app/build/outputs/apk/**/*.apk
          if-no-files-found: error 
