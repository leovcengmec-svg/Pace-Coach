name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Find Android project
        run: |
          echo "Arquivos do repositório:"
          find . -maxdepth 3 -type f | head -100

      - name: Build APK
        run: |
          if find . -name "gradlew" -type f | grep -q .; then
            GRADLEW=$(find . -name "gradlew" -type f | head -1)
            PROJECT_DIR=$(dirname "$GRADLEW")
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "ERRO: gradlew não encontrado."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PaceCoach-debug
          path: '**/build/outputs/apk/debug/*.apk'
