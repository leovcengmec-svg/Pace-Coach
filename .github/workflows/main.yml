name: Build Pace Coach

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Extract Pace Coach V1.7
        run: |
          rm -rf runnerup
          unzip -q PaceCoach_RunnerUp_V1_7_source.zip -d runnerup
          test -f runnerup/settings.gradle
          test -f runnerup/app/build.gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Build APK
        working-directory: runnerup
        run: |
          gradle :app:assembleLatestDebug --no-daemon

      - name: Show APK
        run: |
          find runnerup/app/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PaceCoach-V1.7-debug
          path: runnerup/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
