name: Build Pace Coach

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Extract Pace Coach
        run: |
          rm -rf runnerup
          unzip -q PaceCoach_RunnerUp_V1_7_source.zip -d runnerup

      - name: Adjust SDK for build
        working-directory: runnerup
        run: |
          sed -i "s/compileSdk = 37.2/compileSdk = 36/" build.gradle
          sed -i "s/targetSdk = 37.2/targetSdk = 36/" build.gradle
          sed -i "s/buildToolsVersion = '37.0.0'/buildToolsVersion = '36.0.0'/" build.gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'

      - name: Build APK
        working-directory: runnerup
        run: |
          chmod +x gradlew
          gradle :app:assembleLatestDebug --no-daemon

      - name: Find APK
        run: |
          find runnerup/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PaceCoach-V1.7-debug
          path: runnerup/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
